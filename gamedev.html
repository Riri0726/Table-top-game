<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flipbooks | Table Top & TTRPG</title>
    <style>
      :root { --header-h: 64px; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #0b0b0c; color: #f5f5f5; }
      header {
        position: sticky; top: 0; z-index: 50;
        height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px; background: rgba(17,17,19,0.9); backdrop-filter: blur(6px); border-bottom: 1px solid #222;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.3px; color: #e9e9ee; }
      nav { display: flex; gap: 8px; }
      nav a {
        text-decoration: none; color: #e9e9ee; background: #1a1a1f; border: 1px solid #2a2a33;
        padding: 8px 12px; border-radius: 999px; font-size: 14px;
      }
      nav a:hover { background: #23232b; }
      .wrap { max-width: 1400px; margin: 0 auto; padding: 12px; }
      section.book {
        min-height: calc(100vh - var(--header-h) - 24px);
        display: flex; flex-direction: column; gap: 12px;
        padding: 12px; border-radius: 16px; background: #0f0f13; border: 1px solid #1f1f27;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
      .book h2 { margin: 0; font-size: 18px; font-weight: 600; color: #dfe0ff; }
      .frame-outer { flex: 1; min-height: 70vh; }
      .flipbook-frame { width: 100%; height: 100%; border: 0; border-radius: 10px; }
      .notice { font-size: 12px; opacity: 0.75; }
      @media (max-width: 640px) {
        header { height: 56px; }
        :root { --header-h: 56px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Flipbooks</h1>
      <nav>
        <a href="#table-top">Table Top</a>
        <a href="#ttrpg">Table Top Role Playing Game</a>
      </nav>
    </header>

    <main class="wrap">
      <!-- Flipbook 1 -->
      <section id="table-top" class="book" aria-label="Table Top Flipbook">
        <h2>Table Top</h2>
        <div class="frame-outer">
          <iframe
            class="flipbook-frame"
            src="https://heyzine.com/flip-book/a093cb43e7.html"
            title="Table Top — Heyzine Flipbook"
            allow="clipboard-write"
            loading="lazy"
            allowfullscreen
          ></iframe>
        </div>
        <div class="notice">If the viewer looks small, try pressing the full screen button in the flipbook toolbar.</div>
      </section>

      <!-- Flipbook 2 -->
      <section id="ttrpg" class="book" aria-label="Table Top Role Playing Game Flipbook">
        <h2>Table Top Role Playing Game</h2>
        <div class="frame-outer">
          <iframe
            class="flipbook-frame"
            src="https://heyzine.com/flip-book/cb3e191af7.html"
            title="Table Top Role Playing Game — Heyzine Flipbook"
            allow="clipboard-write"
            loading="lazy"
            allowfullscreen
          ></iframe>
        </div>
        <div class="notice">Tip: Use Ctrl/Cmd + scroll to zoom within the flipbook, or hit the full screen button.</div>
      </section>
    </main>

    <!-- Optional: small script to ensure each section fills the viewport nicely on resize -->
    <script>
      function resizeSections() {
        const headerH = document.querySelector('header').offsetHeight || 64;
        document.querySelectorAll('section.book').forEach(sec => {
          sec.style.minHeight = `calc(100vh - ${headerH}px - 24px)`;
        });
      }
      window.addEventListener('resize', resizeSections);
      window.addEventListener('load', resizeSections);
    </script>
  </body>
</html>
